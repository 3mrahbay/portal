name: Verify Portal Bunny v191 full suite

on:
  push:
    branches:
      - test/portal-bunny-full-v191-20261008

permissions:
  contents: read

jobs:
  full-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PDF verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Run every Portal Node test
        id: tests
        shell: bash
        run: |
          set +e
          node --test tests/*.test.mjs 2>&1 | tee portal-v191-full-test-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload complete test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-v191-full-test-output
          path: portal-v191-full-test-output.txt
          if-no-files-found: error
      - name: Fail when any test fails
        if: steps.tests.outputs.status != '0'
        run: exit 1
