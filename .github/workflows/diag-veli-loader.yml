name: Diagnose Veli Loader
on:
  push:
    branches: [diag/veli-loader-20260921]
permissions:
  contents: write
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/veli-loader-20260921
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract focused parent loader snippets
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          lines=s.splitlines()
          targets=[]
          for i,line in enumerate(lines):
              if any(k in line for k in [
                "veliOgrenciler =",
                "veliOgrenciler.push",
                "veliAktifOgrenci =",
                "ogrenciIds",
                "veliEmailEsles",
                "veliler/" 
              ]):
                  targets.append(i)
          out=[]
          seen=[]
          for i in targets:
              if any(abs(i-j)<35 for j in seen): continue
              seen.append(i)
              a=max(0,i-35); b=min(len(lines),i+70)
              out.append(f"\n===== lines {a+1}-{b} target {i+1} =====\n")
              out.extend(f"{n+1}: {lines[n]}" for n in range(a,b))
              if len(seen)>=12: break
          Path("security/veli-loader-focused.txt").write_text("\n".join(out),encoding="utf-8")
          PY
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add security/veli-loader-focused.txt
          git commit -m "diag: focused veli loader snippets" || exit 0
          git push origin HEAD:diag/veli-loader-20260921
