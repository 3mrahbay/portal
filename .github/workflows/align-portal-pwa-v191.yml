name: Align Portal PWA v191

on:
  push:
    branches:
      - fix/bunny-upload-resilience-20261008
    paths:
      - .github/workflows/align-portal-pwa-v191.yml
      - .github/scripts/align-portal-pwa-v191.mjs

permissions:
  contents: write

jobs:
  align-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bunny-upload-resilience-20261008
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align release generation
        run: node .github/scripts/align-portal-pwa-v191.mjs
      - name: Run focused PWA and Bunny tests
        run: node --test tests/bunny-stream-upload.test.mjs tests/portal-media-release-delivery.test.mjs tests/pwa-delivery-contract.test.mjs tests/admin-mobile-overflow.test.mjs
      - name: Commit verified alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/align-portal-pwa-v191.mjs .github/workflows/align-portal-pwa-v191.yml
          git add index.html tests/portal-media-release-delivery.test.mjs
          git commit -m "fix: align Portal PWA generation with Bunny v191"
          git push origin HEAD:fix/bunny-upload-resilience-20261008
