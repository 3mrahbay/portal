name: Gallery Stream Readiness Check

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/gallery-stream-readiness-check.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: General folder classification
        run: node --experimental-default-type=module --test tests/galeri-konu-klasorleri.test.mjs
      - name: Bunny Stream readiness
        run: node --experimental-default-type=module --test tests/portal-galeri-stream-readiness.test.mjs
