name: Galeri album ve filigran patch

on:
  push:
    branches:
      - fix/galeri-album-filigran-20260917
    paths:
      - scripts/apply-galeri-album-filigran-patch.mjs
      - .github/workflows/galeri-album-filigran-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4
        with:
          ref: fix/galeri-album-filigran-20260917
          fetch-depth: 0

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Güvenli patch uygula
        run: node scripts/apply-galeri-album-filigran-patch.mjs

      - name: JavaScript sözdizimi
        run: |
          node --check portal-galeri.js
          node --input-type=module --check < moduller/veli-galeri.js

      - name: Veli galeri sorgu testi
        run: node --test tests/zeky-veli-galeri-sorgu.test.mjs

      - name: Diff kontrolü
        run: git diff --check

      - name: Patch sonucunu dala yaz
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portal-galeri.js serviceworker.js
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "feat(galeri): albüm hedefleme ve BÇKA filigranını tamamla [skip ci]"
            git push origin HEAD:fix/galeri-album-filigran-20260917
          fi
