name: Verify full Portal suite for gallery v192

on:
  push:
    branches:
      - fix/gallery-ui-metadata-large-video-20261008
    paths:
      - .github/workflows/full-portal-suite-gallery-v192.yml

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gallery-ui-metadata-large-video-20261008
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PDF parser required by the existing student-list tests
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Run complete Portal test suite
        run: node --test tests/*.test.mjs
      - name: Record successful verification and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/full-portal-suite-gallery-v192.yml
          git commit -m "ci: complete full gallery v192 verification"
          git push origin HEAD:fix/gallery-ui-metadata-large-video-20261008
