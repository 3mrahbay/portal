name: Diagnose full Portal suite for gallery v192

on:
  push:
    branches:
      - fix/gallery-ui-metadata-large-video-20261008
    paths:
      - .github/workflows/full-portal-suite-gallery-v192.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gallery-ui-metadata-large-video-20261008
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run every test file and print only failures
        shell: bash
        run: |
          set +e
          failed=0
          total=0
          for f in tests/*.test.mjs; do
            total=$((total + 1))
            node --test "$f" > /tmp/portal-test.log 2>&1
            code=$?
            if [ "$code" -ne 0 ]; then
              failed=$((failed + 1))
              echo "::group::FAILED $f"
              echo "--- failing assertions ---"
              grep -nE "not ok|AssertionError|ERR_|error:|Expected|expected:|actual:|failureType|operator:" /tmp/portal-test.log | head -n 160 || true
              echo "--- final 180 log lines ---"
              tail -n 180 /tmp/portal-test.log
              echo "::endgroup::"
            fi
          done
          echo "TEST_FILES=$total FAILED_FILES=$failed"
          if [ "$failed" -ne 0 ]; then exit 1; fi
