name: Prepare read-only Okul Zili diagnostics
on:
  push:
    branches: [diag/okul-zili-oturum-20260921]
permissions:
  contents: write
concurrency:
  group: okul-zili-tani-prepare
  cancel-in-progress: false
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/okul-zili-oturum-20260921
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add diagnostic button without changing pickup or Rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('index.html'); raw=p.read_bytes()
          actual=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert actual == '1b01ed85271b8a826fedad0a4596c6714d290bc7', 'Unexpected index version; no patch applied'
          s=raw.decode('utf-8')
          needle='      <!-- İzin & Bildirim — moduller/veli-izinleri.js -->'
          assert s.count(needle)==1
          button='      <button type="button" class="ca-btn ghost" onclick="okulZiliTaniAc()" style="width:100%;font-size:13px;">🔎 Okul Zili tanı kontrolü</button>\n\n'
          s=s.replace(needle,button+needle,1)
          hook='\n<!-- Read-only, user-triggered pickup diagnosis. No automatic data requests. -->\n<script>\n  window.okulZiliTaniAc = async function() {\n    if (window.__okulZiliTaniYukleniyor) return;\n    window.__okulZiliTaniYukleniyor = true;\n    try {\n      const tani = await import("./js/okul-zili-tani.js?v=1");\n      await tani.ac(window.PortalAPI);\n    } catch (_) {\n      window.showToast?.("Tanı aracı yüklenemedi. Sayfayı yeniden açın.", "error");\n    } finally { window.__okulZiliTaniYukleniyor = false; }\n  };\n</script>\n'
          pos=s.rfind('</body>'); assert pos>0
          s=s[:pos]+hook+s[pos:]
          assert s.count('onclick="okulZiliTaniAc()"')==1
          assert s.count('window.okulZiliTaniAc = async function()')==1
          p.write_bytes(s.encode('utf-8'))
          # Assert the existing sender remains byte-for-byte unchanged.
          old=raw.decode('utf-8'); start='window.veliOkulZiliBildir = async function()'; end='// Veli teyidi — ZEKY pickupVeliOnayi'
          assert old[old.index(start):old.index(end,old.index(start))] == s[s.index(start):s.index(end,s.index(start))]
          print('PASS: only diagnostic button and lazy opener inserted; sender unchanged')
          PY
      - name: Validate JavaScript and all tests
        run: |
          node --check js/okul-zili-tani.js
          node --test tests/*.test.mjs > /tmp/portal-tests.log 2>&1 || { tail -100 /tmp/portal-tests.log; exit 1; }
          tail -12 /tmp/portal-tests.log
          git diff --check
      - name: Commit tested integration and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/prepare-okul-zili-tani.yml
          git add index.html .github/workflows/prepare-okul-zili-tani.yml
          git commit -m 'diag: expose read-only Okul Zili check on parent home'
          git push origin HEAD:diag/okul-zili-oturum-20260921
