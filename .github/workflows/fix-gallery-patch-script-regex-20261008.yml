name: Repair gallery patch regex counter

on:
  push:
    branches:
      - fix/gallery-ui-metadata-large-video-20261008
    paths:
      - .github/workflows/fix-gallery-patch-script-regex-20261008.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gallery-ui-metadata-large-video-20261008
          fetch-depth: 0
      - name: Repair helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/patch-gallery-ui-metadata-large-video-20261008.mjs')
          s=p.read_text()
          old="  const source=read(path); const matches=[...source.matchAll(pattern)];\n"
          new="  const source=read(path); const matcher=new RegExp(pattern.source,pattern.flags.includes('g')?pattern.flags:pattern.flags+'g'); const matches=[...source.matchAll(matcher)];\n"
          if s.count(old)!=1:
              raise SystemExit(f'expected one helper line, found {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-gallery-patch-script-regex-20261008.yml
          git add .github/scripts/patch-gallery-ui-metadata-large-video-20261008.mjs
          git commit -m "ci: repair gallery patch regex matching"
          git push origin HEAD:fix/gallery-ui-metadata-large-video-20261008
