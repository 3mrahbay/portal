name: Randevu Firestore güvenlik testleri

on:
  pull_request:
    paths:
      - "security/**"
      - ".github/workflows/firestore-randevu-rules-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: security
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v5
      - name: Node.js kur
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Java kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Test bağımlılıklarını kur
        run: npm install --no-audit --no-fund
      - name: Firestore güvenlik testlerini çalıştır
        run: npm run test:rules
