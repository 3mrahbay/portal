name: Duplicate payment notice validation
on:
  push:
    branches: ['feat/veli-mukerrer-odeme-bildirimi-20260923']
    paths: ['.github/workflows/duplicate-payment-notice.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check js/finans/parent.js
          node --check js/finans/payment-actions.js
          node --check js/finans/payment-workspace.js
      - name: Finance regression tests
        run: node --test tests/finans-*.test.mjs
