name: Apply Bunny upload resilience patch

on:
  push:
    branches:
      - fix/bunny-upload-resilience-20261008
    paths:
      - .github/workflows/apply-bunny-resilience-20261008.yml
      - .github/scripts/patch-bunny-resilience-20261008.mjs

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bunny-upload-resilience-20261008
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply deterministic patch
        run: node .github/scripts/patch-bunny-resilience-20261008.mjs
      - name: Run focused gallery upload tests
        run: node --test tests/bunny-stream-upload.test.mjs tests/galeri-mail-hedefleri.test.mjs tests/portal-gallery-file-contract.test.mjs
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/patch-bunny-resilience-20261008.mjs .github/workflows/apply-bunny-resilience-20261008.yml
          git add js/bunny-stream-upload.js index.html portal-galeri-core.js serviceworker.js tests/bunny-stream-upload.test.mjs
          git commit -m "fix: harden Bunny Stream video uploads"
          git push origin HEAD:fix/bunny-upload-resilience-20261008
