name: Verify Portal Bunny full suite

on:
  push:
    branches:
      - test/portal-bunny-full-20261008

permissions:
  contents: read

jobs:
  full-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run every Portal Node test and capture output
        id: tests
        shell: bash
        run: |
          set +e
          node --test tests/*.test.mjs 2>&1 | tee full-test-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-full-test-output
          path: full-test-output.txt
          if-no-files-found: error
      - name: Fail when tests fail
        if: steps.tests.outputs.status != '0'
        run: exit 1
