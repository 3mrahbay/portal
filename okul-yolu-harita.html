<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; frame-src https://www.google.com; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Okul Yolu · Harita</title>
<!--
  ZEKY iOS uygulaması için Okul Yolu harita ara sayfası.
  iOS uygulaması capacitor://localhost adresinden çalışır ve WebKit oradan giden
  isteklere Referer eklemez; alan adıyla kısıtlı Google Embed anahtarı da bu yüzden
  haritayı reddeder. ZEKY haritayı bu sayfanın içinde açar; Google'a giden istek
  portal.bircicekkoleji.com adresinden gittiği için anahtar kabul eder.
  Parametreler adresin # kısmındadır (sunucuya gönderilmez). Sayfa yalnız
  doğrulanmış parametrelerle Google Maps Embed yol tarifini çizer.
  Kullanan: ZEKY www/js/zeky-yol.js (IOS_HARITA_CERCEVESI). Adı değişirse orası da değişmeli.
-->
<style>
  html, body { margin: 0; height: 100%; background: #EEF2EF; overflow: hidden; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<script>
(function () {
  'use strict';
  var KOORDINAT = /^-?\d{1,2}(\.\d{1,7})?,-?\d{1,3}(\.\d{1,7})?$/;
  var YER_KAYDI = /^place_id:[A-Za-z0-9_-]{16,300}$/;
  var ANAHTAR = /^AIza[0-9A-Za-z_-]{35}$/;
  var MODLAR = { driving: true, walking: true, transit: true };

  function haritaAdresi(hash) {
    var p = new URLSearchParams(String(hash || '').replace(/^#/, ''));
    var key = p.get('key') || '';
    var origin = p.get('origin') || '';
    var destination = p.get('destination') || '';
    var mode = p.get('mode') || '';
    if (!ANAHTAR.test(key) || !KOORDINAT.test(origin) ||
        !(KOORDINAT.test(destination) || YER_KAYDI.test(destination)) ||
        !Object.prototype.hasOwnProperty.call(MODLAR, mode)) return '';
    var q = new URLSearchParams({ key: key, origin: origin, destination: destination, mode: mode, language: 'tr', region: 'TR' });
    return 'https://www.google.com/maps/embed/v1/directions?' + q.toString();
  }

  function ciz() {
    var adres = haritaAdresi(location.hash);
    var cerceve = document.querySelector('iframe');
    if (!adres) { if (cerceve) cerceve.remove(); return; }
    if (!cerceve) {
      cerceve = document.createElement('iframe');
      cerceve.title = 'Okula giden rota haritası';
      cerceve.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
      document.body.appendChild(cerceve);
    }
    if (cerceve.getAttribute('src') !== adres) cerceve.setAttribute('src', adres);
  }

  // ZEKY ulaşım türünü değiştirince yalnız # değişir; sayfa yeniden yüklenmez.
  window.addEventListener('hashchange', ciz);
  ciz();
})();
</script>
</body>
</html>
